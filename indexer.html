<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Photo Scanner (Admin Only)</title>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; background: #222; color: #fff; }
        #progress { font-size: 20px; font-weight: bold; color: #00ff00; margin: 20px; }
        .warning { color: yellow; font-size: 14px; }
        #logs { height: 300px; overflow-y: scroll; background: #111; padding: 10px; font-size: 13px; text-align: left; margin-top: 20px; border: 1px solid #555; color: #0f0;}
    </style>
</head>
<body>
    <h2>🚀 700 Photos AI Indexer (Crowd Fix Version)</h2>
    <p class="warning">कृपया इस टैब को बंद न करें। भीड़ वाली फोटो स्कैन होने में थोड़ा ज़्यादा समय (20-25 मिनट) लग सकता है।</p>
    <button id="start-btn" style="padding: 15px 30px; font-size: 18px; cursor: pointer; background: #d84315; color: white; border: none; border-radius: 5px;">स्कैनिंग चालू करें</button>
    <div id="progress">तैयार...</div>
    <div id="logs">सिस्टम रेडी है...<br></div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const progress = document.getElementById('progress');
        const logs = document.getElementById('logs');
        const MODEL_URL = 'https://cdn.jsdelivr.net/gh/cgarciagl/face-api.js@0.22.2/weights';

        function logMsg(msg) {
            logs.innerHTML += `<div>${msg}</div>`;
            logs.scrollTop = logs.scrollHeight; 
        }

        async function startProcess() {
            startBtn.disabled = true;
            progress.innerText = "AI मॉडल्स लोड हो रहे हैं...";
            logMsg("Models loading...");
            
            try {
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
            } catch (err) {
                logMsg("❌ Models load होने में एरर: " + err.message);
                return;
            }

            progress.innerText = "लिंक्स पढ़े जा रहे हैं...";
            const response = await fetch('photos%20link.txt');
            const textData = await response.text();
            
            const regex = /\/d\/([a-zA-Z0-9_-]+)\/view/g;
            let match;
            const photoIds = [];
            while ((match = regex.exec(textData)) !== null) {
                if (!photoIds.includes(match[1])) photoIds.push(match[1]);
            }

            progress.innerText = `कुल ${photoIds.length} लिंक्स मिले। स्कैनिंग चालू...`;
            
            const finalData = [];
            
            for (let i = 0; i < photoIds.length; i++) {
                const id = photoIds[i];
                
                // CROWD FIX 1: Photo ka resolution 400 se badhakar 1000 kar diya hai
                const imgUrl = `https://wsrv.nl/?url=drive.google.com/uc?id=${id}&w=1000`; 
                
                try {
                    const img = await faceapi.fetchImage(imgUrl);
                    
                    // CROWD FIX 2: inputSize ko 320 se 608 kar diya (ताकि छोटे चेहरे भी दिखें)
                    // CROWD FIX 3: scoreThreshold 0.3 कर दिया (ताकि थोड़ा ब्लर चेहरा भी पकड़ ले)
                    const detections = await faceapi.detectAllFaces(img, new faceapi.TinyFaceDetectorOptions({ inputSize: 608, scoreThreshold: 0.3 })).withFaceLandmarks().withFaceDescriptors();
                    
                    if (detections.length > 0) {
                        const faces = detections.map(d => Array.from(d.descriptor));
                        finalData.push({ id: id, faces: faces });
                        logMsg(`✅ सफलता: ID ${id} में ${faces.length} चेहरे मिले!`);
                    } else {
                        logMsg(`⚠️ कोई चेहरा नहीं: ID ${id} में इंसान नहीं दिखा।`);
                    }
                } catch (e) {
                    logMsg(`❌ स्किप: ID ${id} (शायद वीडियो है या लिंक करप्ट है)।`);
                }
                
                progress.innerText = `स्कैन हो रहा है: ${i + 1} / ${photoIds.length} | सफल फोटो: ${finalData.length}`;
            }

            progress.innerText = "स्कैन पूरा हुआ! फ़ाइल डाउनलोड हो रही है...";
            
            if (finalData.length === 0) {
                alert("एक भी फोटो स्कैन नहीं हुई! कुछ गड़बड़ है।");
                return;
            }

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(finalData));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "data.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        startBtn.addEventListener('click', startProcess);
    </script>
</body>
</html>
