<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Photo Scanner (Admin Only)</title>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; background: #222; color: #fff; }
        #progress { font-size: 24px; font-weight: bold; color: #00ff00; margin: 20px; }
        .warning { color: yellow; font-size: 14px; }
    </style>
</head>
<body>
    <h2>🚀 700 Photos AI Indexer (सिर्फ तुम्हारे लिए)</h2>
    <p class="warning">कृपया इस टैब को बंद न करें। इसमें 10-15 मिनट लग सकते हैं।</p>
    <button id="start-btn" style="padding: 15px 30px; font-size: 18px; cursor: pointer;">स्कैनिंग चालू करें</button>
    <div id="progress">तैयार...</div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const progress = document.getElementById('progress');
        const MODEL_URL = 'https://cdn.jsdelivr.net/gh/cgarciagl/face-api.js@0.22.2/weights';

        async function startProcess() {
            startBtn.disabled = true;
            progress.innerText = "AI मॉडल्स लोड हो रहे हैं...";
            
            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
            ]);

            progress.innerText = "लिंक्स पढ़े जा रहे हैं...";
            const response = await fetch('photos%20link.txt');
            const textData = await response.text();
            
            const regex = /\/d\/([a-zA-Z0-9_-]+)\/view/g;
            let match;
            const photoIds = [];
            while ((match = regex.exec(textData)) !== null) {
                if (!photoIds.includes(match[1])) photoIds.push(match[1]);
            }

            progress.innerText = `कुल ${photoIds.length} लिंक्स मिले। स्कैनिंग चालू...`;
            
            const finalData = [];
            
            // Ek-ek karke scan karenge taaki Drive block na kare
            for (let i = 0; i < photoIds.length; i++) {
                const id = photoIds[i];
                const imgUrl = `https://drive.google.com/thumbnail?id=${id}&sz=w500`; // Speed ke liye choti photo
                
                try {
                    const img = await faceapi.fetchImage(imgUrl);
                    const detections = await faceapi.detectAllFaces(img, new faceapi.TinyFaceDetectorOptions({ inputSize: 320 })).withFaceLandmarks().withFaceDescriptors();
                    
                    if (detections.length > 0) {
                        // AI Data ko JSON format me convert karna
                        const faces = detections.map(d => Array.from(d.descriptor));
                        finalData.push({ id: id, faces: faces });
                    }
                } catch (e) {
                    console.log(`ID ${id} स्किप हो गई (शायद वीडियो है)`);
                }
                
                progress.innerText = `स्कैन हो रहा है: ${i + 1} / ${photoIds.length} (${finalData.length} फोटो में चेहरे मिले)`;
            }

            progress.innerText = "स्कैन पूरा हुआ! फ़ाइल डाउनलोड हो रही है...";
            
            // data.json file download karwana
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(finalData));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "data.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        startBtn.addEventListener('click', startProcess);
    </script>
</body>
</html>
